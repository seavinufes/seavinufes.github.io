<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Enade Ufes - Supervisor de Estágio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Página do supervisor de estágio da AP (link pessoal, sem login) -- 20_SupervisoresAP.gs */
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { font-family:'Inter', system-ui, -apple-system, sans-serif; background:#f4f5f7; color:#0f172a; -webkit-tap-highlight-color:transparent; }
    .sp-app { display:flex; flex-direction:column; height:100%; }
    .sp-topo { background:#1e1040; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); flex:0 0 auto; }
    /* Enade das Licenciaturas e Ufes no mesmo cartão branco, separados por um fio (marcas parceiras) */
    .sp-logo { background:#fff; border-radius:10px; padding:7px 14px; display:inline-flex; min-height:44px; align-items:center; gap:13px; }
    .sp-logo img { height:38px; display:block; }
    .sp-logo #sp-logo { height:31px; } /* Enade um pouco menor: respiro dentro do cartão */
    .sp-logo .sp-fio { width:1px; align-self:stretch; background:#cbd5e1; }
    .sp-rol { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .sp-miolo { max-width:560px; margin:0 auto; padding:16px 14px calc(28px + env(safe-area-inset-bottom)); }
    .sp-card { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:15px; margin-bottom:12px; }
    h1 { font-size:21px; font-weight:800; margin:0 0 8px; }
    h2 { font-size:16px; font-weight:800; margin:0 0 10px; }
    p, li { font-size:14.5px; line-height:1.55; color:#334155; }
    p { margin:0 0 10px; } p:last-child { margin-bottom:0; }
    ol, ul { margin:0; padding-left:20px; } li { margin-bottom:6px; }
    a { color:#1d4ed8; }
    details { border:1px solid #e5e7eb; border-radius:11px; margin-top:10px; overflow:hidden; }
    summary { display:flex; justify-content:space-between; align-items:center; padding:13px 14px; min-height:48px; font-weight:600; font-size:14.5px; background:#f8fafc; cursor:pointer; list-style:none; }
    summary::-webkit-details-marker { display:none; }
    details[open] summary .material-icons { transform:rotate(180deg); }
    details > div { padding:12px 14px; }
    .sp-lgpd { background:#eff6ff; border-left:4px solid #1d4ed8; border-radius:0 10px 10px 0; padding:11px 13px; font-size:13.5px; line-height:1.55; color:#1e3a8a; margin-bottom:14px; }
    .sp-aviso { background:#fffbeb; border-left:4px solid #f59e0b; border-radius:0 10px 10px 0; padding:11px 13px; font-size:14px; line-height:1.5; color:#78350f; margin-bottom:14px; }
    label { display:block; font-weight:600; font-size:14px; color:#1e293b; margin:14px 0 6px; }
    input[type=text], input[type=tel] { width:100%; font:16px 'Inter', sans-serif; border:1px solid #cbd5e1; border-radius:10px; padding:12px; min-height:48px; color:#0f172a; background:#fff; }
    input:focus { outline:2px solid #4c3a8f; outline-offset:1px; }
    .sp-dica { font-size:12.5px; color:#64748b; margin-top:5px; }
    .sp-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .sp-chip { display:inline-flex; align-items:center; gap:4px; background:#ede9fe; color:#4c1d95; border-radius:999px; padding:7px 6px 7px 12px; font-size:13px; font-weight:600; }
    .sp-chip button { border:0; background:transparent; color:#4c1d95; width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
    .sp-chip .material-icons { font-size:17px; }
    .sp-lista { border:1px solid #cbd5e1; border-radius:10px; margin-top:6px; max-height:280px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .sp-lista button { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid #eef0f3; background:#fff; padding:11px 12px; min-height:48px; font:500 15px 'Inter', sans-serif; color:#0f172a; }
    .sp-lista small { display:block; font-size:12px; color:#64748b; }
    .sp-vazio { padding:12px; font-size:13.5px; color:#64748b; }
    .sp-check { display:flex; gap:10px; align-items:flex-start; margin-top:16px; font-size:14px; line-height:1.5; color:#334155; }
    .sp-check input { width:22px; height:22px; margin-top:1px; flex:0 0 auto; }
    .sp-btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:0; border-radius:12px; padding:14px; min-height:52px; margin-top:16px; font:700 15.5px 'Inter', sans-serif; background:#121212; color:#fff; cursor:pointer; }
    .sp-btn:disabled { opacity:.6; }
    .sp-resumo { display:grid; gap:9px; }
    .sp-resumo div { font-size:12px; color:#64748b; } .sp-resumo b { display:block; font-size:15px; color:#0f172a; font-weight:600; }
    .sp-ok { display:inline-flex; align-items:center; gap:5px; background:#dcfce7; color:#14532d; border-radius:999px; padding:6px 12px; font-size:13.5px; font-weight:700; margin-bottom:12px; }
    .sp-carregando { text-align:center; padding:60px 0; color:#475569; font-weight:600; }
    .sp-erro { color:#b91c1c; font-size:13.5px; margin-top:8px; display:none; }
  </style>
</head>

    const c = soDigitos(cpf);
    if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
    for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += Number(c[i]) * ((t + 1) - i); if (((s * 10) % 11) % 10 !== Number(c[t])) return false; }
    return true;
  }

  google.script.run.withSuccessHandler(logo => { const i = document.getElementById('sp-logo'); i.src = logo; i.style.display = ''; }).getLogoCurso('LICENCIATURA');
  google.script.run.withSuccessHandler(lista => { SP.escolas = (lista || []).map(e => ({ nome: String(e[0]), inep: String(e[1]) })); SP.escolas.forEach(e => { SP.mapa[e.inep] = e.nome; }); }).getListaEscolasAP();
  google.script.run.withSuccessHandler(d => {
    if (!d || !d.sucesso) { document.getElementById('sp-miolo').innerHTML = '<div class="sp-card"><p>' + esc((d && d.msg) || 'Não foi possível abrir o seu cadastro.') + '</p></div>'; return; }
    SP.dados = d; SP.sel = d.escolas.map(e => e.inep); d.escolas.forEach(e => { SP.mapa[e.inep] = SP.mapa[e.inep] || e.nome; });
    SP.editando = !d.cadastrado || d.reconfirmarEscolas;
    render();
  }).withFailureHandler(avisoFalhaConexaoExterna).getCadastroSupervisorAP(TOKEN);

  // Falha de conexão: quase sempre é o Google bloqueando por haver mais de uma conta Google aberta
  // no navegador. Orienta a abrir o link pessoal numa janela anônima.
  function avisoJanelaAnonimaSup(e) {
    document.getElementById('sp-miolo').innerHTML = `<div class="sp-card"><h1>Não foi possível abrir o seu cadastro</h1>
      <div class="sp-aviso">Isso costuma acontecer quando há <b>mais de uma conta Google aberta</b> neste navegador (por exemplo, uma do trabalho e uma pessoal). Abra o seu link numa <b>janela anônima</b>.</div>
      <p><a href="${esc(URL_AJUDA_ANONIMA)}" target="_blank" rel="noopener"><b>Veja como abrir uma janela anônima</b></a></p>
      <label for="sp-link-proprio">Seu link pessoal (copie e cole na janela anônima):</label>
      <input type="text" id="sp-link-proprio" readonly value="${esc(LINK_PROPRIO)}" onclick="this.select()">
      <p class="sp-dica">Detalhe técnico: ${esc(e && e.message)}</p></div>`;
  }

  function render() {
    const d = SP.dados;
    const est = d.estudantes || [];
    // Abertura no mesmo padrão do e-mail ao supervisor (EMAIL_AP_SUPERVISOR)
    const escolasEst = est.map(e => e.escola).filter((x, k, l) => x && l.indexOf(x) === k);
    let vinculo = '';
    if (est.length === 1 || (est.length > 1 && escolasEst.length <= 1)) {
      if (escolasEst.length) vinculo += `<p><b>Escola:</b>&nbsp;${esc(escolasEst[0])}</p>`;
      vinculo += `<p><b>${est.length > 1 ? 'Estudantes' : 'Estudante'}:</b>&nbsp;${est.map(e => esc(e.nome)).join(', ')}</p>`;
    } else if (est.length > 1) {
      vinculo += '<p><b>Estudantes:</b></p><ul style="margin-bottom:10px">' + est.map(e => `<li>${esc(e.nome)}${e.escola ? ' &ndash; ' + esc(e.escola) : ''}</li>`).join('') + '</ul>';
    }
    let html = `<div class="sp-card"><p>Prezado(a) professor(a) <b>${esc(d.nome)}</b>,</p>
      <p>Você foi indicado(a) como <b>supervisor(a) de estágio</b> na <b>Avaliação da Prática do Enade ${esc(d.ano)}.</b></p>
      ${vinculo}
      <details><summary>O que faz o supervisor?<i class="material-icons">expand_more</i></summary><div>
        <p>A <b>Avaliação da Prática (&quot;AP&quot;)</b> é a parte do Enade das Licenciaturas em que um(a) professor(a) da escola, o(a) <b>supervisor(a)</b>, assiste a uma aula dada pelo(a) estagiário(a) durante o estágio supervisionado obrigatório e a avalia com base no plano de aula.</p>
        <p>O Enade é aplicado pelo <b>Inep</b> (Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira), órgão do <b>Ministério da Educação (MEC)</b>. A capacitação e a avaliação são feitas no <b>Sistema Enade do Inep</b>, em <a href="https://enade.inep.gov.br" target="_blank" rel="noopener">enade.inep.gov.br</a>, com a sua conta gov.br.</p>
        <ol><li>Complete o seu cadastro <b>nesta página</b>. Com ele, a Ufes inscreve você como supervisor(a) no Sistema Enade do Inep.</li>
        <li>Depois da inscrição, entre no <a href="https://enade.inep.gov.br" target="_blank" rel="noopener">Sistema Enade do Inep</a> e complete lá o seu cadastro.</li>
        <li>Faça, no mesmo Sistema Enade, a <b>capacitação on-line</b> obrigatória. Ela é autoinstrucional: você faz no horário que preferir.</li>
        <li>Combine com o(a) estagiário(a) o dia da <b>regência</b> (a aula). Assista à aula e avalie-a com base no plano de aula apresentado.</li>
        <li>Preencha, no Sistema Enade, o <b>Instrumento de Avaliação da Prática pelo Supervisor</b> em até <b>10 dias corridos</b> após a regência. Cada estagiário(a) só pode ser avaliado(a) uma vez.</li></ol>
        <p style="margin-top:10px">Os prazos de cada etapa são definidos pelo <b>Edital da AP vigente</b>, publicado pelo Inep/MEC, e não podem ser prorrogados. Veja o <a href="https://enade.ufes.br/enade-licenciaturas/cronograma-ap" target="_blank" rel="noopener">cronograma da AP</a>.</p>
      </div></details>
      <details><summary>Auxílio de R$ 100 por avaliação<i class="material-icons">expand_more</i></summary><div>
        <p>O(a) supervisor(a) recebe o <b>Auxílio de Avaliação Educacional (AAE)</b> de <b>R$ 100,00 por avaliação</b> realizada, até <b>R$ 1.000,00 por semestre</b>. O pagamento é feito pelo Inep/MEC, não pela Ufes, e pode atrasar.</p>
      </div></details>
      <details><summary>Tutoriais, guias e links úteis<i class="material-icons">expand_more</i></summary><div>
        <ul><li><a href="https://download.inep.gov.br/enade_das_licenciaturas/guia_do_supervisor_da_avaliacao_pratica.pdf" target="_blank" rel="noopener">Guia do Supervisor da Avaliação da Prática</a> (Inep/MEC)</li>
        <li><a href="https://download.inep.gov.br/enade_das_licenciaturas/manual_funcionalidades_perfil_supervisor_2.pdf" target="_blank" rel="noopener">Passo a passo do Sistema Enade para o supervisor</a> (Inep/MEC)</li>
        <li><a href="https://enade.inep.gov.br" target="_blank" rel="noopener">Sistema Enade do Inep</a>: cadastro, capacitação e avaliação</li>
        <li><a href="https://enade.ufes.br/enade-licenciaturas/cronograma-ap" target="_blank" rel="noopener">Cronograma da AP</a>: prazos do edital vigente</li>
        <li><a href="https://enade.ufes.br/%C3%A1rea-do-professor/supervisor-de-est%C3%A1gio" target="_blank" rel="noopener">Página do supervisor no site do Enade Ufes</a></li></ul>
        <p style="margin-top:10px">Dúvidas: <a href="mailto:enade@ufes.br">enade@ufes.br</a> (Seavin/Ufes).</p>
      </div></details></div>`;

    html += '<div class="sp-card"><h2>Seu cadastro</h2>';
    if (d.cadastrado && !SP.editando) {
      html += `<span class="sp-ok"><i class="material-icons" style="font-size:18px">check_circle</i>Cadastro completo</span>
        <div class="sp-resumo"><div>Nome<b>${esc(d.nome)}</b></div><div>CPF<b>${esc(d.cpfMasc)}</b></div><div>Celular<b>${esc(d.celularMasc)}</b></div>
        <div>Escolas onde você trabalha<b>${d.escolas.map(e => esc(e.nome)).join('<br>')}</b></div></div>
        <button type="button" class="sp-btn" style="background:#fff;color:#0f172a;border:1.5px solid #cbd5e1" onclick="SP.editando=true; render()"><i class="material-icons">edit</i>Atualizar o meu cadastro</button>`;
    } else {
      html += `<div class="sp-lgpd"><b>Proteção dos seus dados (LGPD):</b> os seus dados ficam guardados apenas na base da Secretaria de Avaliação Institucional (Seavin/Ufes) e são usados somente para a sua inscrição como supervisor(a) no Inep. Nem coordenadores de curso, nem estudantes, nem orientadores de estágio têm acesso a eles. Só entraremos em contato em caso de extrema necessidade.</div>
        ${d.reconfirmarEscolas ? '<div class="sp-aviso"><b>Nova edição do Enade:</b> confirme as escolas onde você trabalha em ' + esc(d.ano) + '. Tire as que não valem mais e acrescente as novas.</div>' : ''}
        <label for="sp-nome">Nome completo</label>
        <input type="text" id="sp-nome" autocomplete="name" value="${esc(d.nome)}">
        <label for="sp-cpf">CPF</label>
        <input type="text" id="sp-cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="${d.cadastrado ? esc(d.cpfMasc) + ' (deixe em branco para manter)' : '000.000.000-00'}" oninput="mascCpf(this)" onpaste="return false" ondrop="return false">
        <label for="sp-cpf2">Confirme o CPF</label>
        <input type="text" id="sp-cpf2" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" oninput="mascCpf(this)" onpaste="return false" ondrop="return false">
        <div class="sp-dica">Colar está desativado nos campos de CPF, para evitar erro de digitação.</div>
        <label for="sp-cel">Celular (com DDD)</label>
        <input type="tel" id="sp-cel" inputmode="numeric" autocomplete="tel-national" maxlength="15" placeholder="${d.cadastrado ? esc(d.celularMasc) + ' (deixe em branco para manter)' : '(27) 99999-9999'}" oninput="mascCel(this)">
        <label for="sp-escola-busca">Escolas de educação básica onde você trabalha</label>
        <div class="sp-chips" id="sp-chips"></div>
        <input type="text" id="sp-escola-busca" autocomplete="off" placeholder="Busque pelo nome da escola" oninput="buscarEscola(this.value)">
        <div class="sp-lista" id="sp-escolas" style="display:none"></div>
        <label class="sp-check"><input type="checkbox" id="sp-aceite"><span>Estou ciente de como os meus dados serão usados e guardados, conforme o aviso acima.</span></label>
        <div class="sp-erro" id="sp-erro"></div>
        <button type="button" class="sp-btn" id="sp-salvar" onclick="salvar()"><i class="material-icons">check</i>Salvar cadastro</button>`;
    }
    html += '</div>';
    document.getElementById('sp-miolo').innerHTML = html;
    if (SP.editando || !d.cadastrado) renderChips();
  }

  function renderChips() {
    document.getElementById('sp-chips').innerHTML = SP.sel.map(i => `<span class="sp-chip">${esc(SP.mapa[i] || ('Inep ' + i))}<button type="button" aria-label="Remover" onclick="tirarEscola('${esc(i)}')"><i class="material-icons">close</i></button></span>`).join('');
  }
  function tirarEscola(i) { SP.sel = SP.sel.filter(x => x !== i); renderChips(); }
  function buscarEscola(v) {
    const box = document.getElementById('sp-escolas'), t = norm(v);
    if (t.length < 3) { box.style.display = 'none'; return; }
    const r = SP.escolas.filter(e => SP.sel.indexOf(e.inep) === -1 && (norm(e.nome).indexOf(t) > -1 || e.inep.indexOf(t) > -1)).slice(0, 30);
    box.innerHTML = r.length ? r.map(e => `<button type="button" onclick="porEscola('${esc(e.inep)}')">${esc(e.nome)}<small>Inep ${esc(e.inep)}</small></button>`).join('') : '<div class="sp-vazio">Nenhuma escola encontrada com esse nome.</div>';
    box.style.display = '';
  }
  function porEscola(i) {
    if (SP.sel.indexOf(i) === -1) SP.sel.push(i);
    document.getElementById('sp-escola-busca').value = ''; document.getElementById('sp-escolas').style.display = 'none';
    renderChips();
  }

  function erro(m) { const e = document.getElementById('sp-erro'); e.textContent = m; e.style.display = 'block'; }
  function salvar() {
    const d = SP.dados;
    const nome = document.getElementById('sp-nome').value.trim();
    const cpf = soDigitos(document.getElementById('sp-cpf').value), cpf2 = soDigitos(document.getElementById('sp-cpf2').value);
    const cel = soDigitos(document.getElementById('sp-cel').value);
    if (nome.split(/\s+/).length < 2) return erro('Informe o seu nome completo.');
    if (cpf || !d.cadastrado) {
      if (!cpfValido(cpf)) return erro('CPF inválido. Confira a digitação.');
      if (cpf !== cpf2) return erro('Os dois CPFs não são iguais. Confira a digitação.');
    }
    if (cel || !d.cadastrado) { if (cel.length !== 11 || cel[2] !== '9') return erro('Informe um celular válido, com DDD (11 dígitos).'); }
    if (!SP.sel.length) return erro('Informe ao menos uma escola onde você trabalha.');
    if (!document.getElementById('sp-aceite').checked) return erro('Marque a ciência sobre o uso dos seus dados.');
    const btn = document.getElementById('sp-salvar'); btn.disabled = true; btn.textContent = 'Salvando...';
    google.script.run.withSuccessHandler(r => {
      if (!r || !r.sucesso) { btn.disabled = false; btn.innerHTML = '<i class="material-icons">check</i>Salvar cadastro'; return erro((r && r.msg) || 'Não foi possível salvar.'); }
      google.script.run.withSuccessHandler(dd => { SP.dados = dd; SP.sel = dd.escolas.map(e => e.inep); SP.editando = false; render(); window.scrollTo(0, 0); }).getCadastroSupervisorAP(TOKEN);
    }).withFailureHandler(e => { btn.disabled = false; btn.innerHTML = '<i class="material-icons">check</i>Salvar cadastro'; erro('Erro de conexão: ' + e.message); })
      .salvarCadastroSupervisorAP(TOKEN, { nome: nome, cpf: cpf, celular: cel, escolas: SP.sel, aceite: true });
  }
</script>
</body>
</html>
